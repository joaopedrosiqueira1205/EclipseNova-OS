# EclipseNova OS baseline
# Mantido conservador para computadores com pouca RAM.
FIREWALL_DEFAULT_INPUT=drop
FIREWALL_DEFAULT_OUTPUT=accept
SSH_SERVER_DEFAULT=disabled
ROOT_SSH_LOGIN=disabled
AUTOMATIC_SECURITY_CHECKS=enabled
MALWARE_ON_ACCESS_DEFAULT=disabled
# On-access malware scanning is intentionally not forced on low-memory machines.
