# EclipseNova OS - Build Configuration

# O sistema sera construido em /mnt/lfs no notebook Linux.
ROOTFS="/mnt/lfs"

# Compilacao conservadora para notebook com 4 GB de RAM.
BUILD_JOBS="1"

# Verificacoes de seguranca do processo de build.
VERIFY_DOWNLOADS="yes"
CLEAN_BUILD="yes"
STOP_ON_ERROR="yes"